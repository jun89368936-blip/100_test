services:
  - type: web
    name: equipment-rental
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      # 외부 PostgreSQL(Neon) 사용. Render 대시보드 Environment 탭에서 직접 설정하며,
      # sync: false 이므로 배포할 때 이 파일 값으로 덮어쓰지 않는다.
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_PIN
        sync: false
