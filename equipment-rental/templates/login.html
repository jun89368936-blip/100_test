<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — 물품 대여 관리</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.10); padding: 48px 40px 40px; width: 100%; max-width: 400px; }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo .logo-icon { font-size: 2.8rem; }
    .login-logo h1 { font-size: 1.25rem; font-weight: 700; color: #1e293b; margin: 8px 0 0; }
    .login-logo p { font-size: 0.85rem; color: #64748b; margin: 4px 0 0; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.83rem; font-weight: 600; color: #475569; margin-bottom: 6px; }
    .login-btn { width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-icon">📦</div>
      <h1>물품 대여 관리 시스템</h1>
      <p>부서 공유 물품 대여·반납 플랫폼</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-wrap" style="margin-bottom:16px;">
          {% for category, message in messages %}
            <div class="flash-msg flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">아이디</label>
        <input class="input-field" id="username" type="text" name="username" placeholder="아이디 입력" required autofocus style="width:100%">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">비밀번호</label>
        <input class="input-field" id="password" type="password" name="password" placeholder="비밀번호 입력" required style="width:100%">
      </div>
      <button type="submit" class="btn btn-primary login-btn">🔑 로그인</button>
    </form>
  </div>
</body>
</html>
