<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입안서 미리보기</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --ink: #1f2328; --muted: #6b7280; --line: #d9dce1;
    --accent: #2563eb; --done: #15803d; --doing: #2563eb; --wait: #9ca3af;
    --need-bg: #fff3bf; --need-ink: #7a5b00; --ext-bg: #ffe1e1; --ext-ink: #9b1c1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "맑은 고딕", "Malgun Gothic", system-ui, sans-serif; font-size: 14px; }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }
  .brand { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .brand h1 { font-size: 15px; margin: 0 0 4px; }
  .brand .sub { color: var(--muted); font-size: 12px; }
  .progress { height: 6px; background: #e5e7eb; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--done); }
  .list { list-style: none; margin: 0; padding: 6px 0; }
  .list li { padding: 8px 16px; cursor: pointer; border-left: 3px solid transparent; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .list li:hover { background: #f6f8fa; }
  .list li.sel { background: #eef4ff; border-left-color: var(--accent); }
  .list .t { font-weight: 600; }
  .list .todo { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; color: #fff; white-space: nowrap; align-self: start; }
  .b-완료 { background: var(--done); } .b-작업중 { background: var(--doing); } .b-대기 { background: var(--wait); }
  .flags { grid-column: 1 / -1; font-size: 11px; display: flex; gap: 6px; }
  .flags span { padding: 0 6px; border-radius: 4px; }
  .f-need { background: var(--need-bg); color: var(--need-ink); } .f-ext { background: var(--ext-bg); color: var(--ext-ink); }
  .f-draft { background: #eceff3; color: var(--muted); }
  .side-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 16px; font-size: 12px; color: var(--muted); }
  .side-foot details { margin-top: 6px; }
  .side-foot li { margin: 3px 0; }
  main { overflow-y: auto; overflow-x: hidden; min-width: 0; }
  .bar { position: sticky; top: 0; z-index: 2; background: rgba(243,244,246,.95); backdrop-filter: blur(4px); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .bar h2 { font-size: 16px; margin: 0; }
  .bar .meta { color: var(--muted); font-size: 12px; }
  .bar .spacer { flex: 1; }
  .live { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #e5e7eb; color: var(--muted); }
  .live.ok { background: #dcfce7; color: var(--done); } .live.busy { background: #dbeafe; color: var(--doing); } .live.err { background: var(--ext-bg); color: var(--ext-ink); }
  .bar button { font: inherit; font-size: 12px; padding: 4px 10px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
  .note { margin: 14px auto 0; max-width: 820px; font-size: 13px; color: var(--muted); padding: 0 16px; }
  .checks { margin: 10px auto 0; max-width: 820px; background: #fffbea; border: 1px solid #f1e3a6; border-radius: 6px; padding: 8px 14px; font-size: 13px; }
  .checks:empty { display: none; }
  .checks b { display: block; margin-bottom: 2px; }
  .checks ul { margin: 0; padding-left: 18px; }
  .paper { background: #fff; max-width: 820px; margin: 14px auto 40px; padding: 48px 56px; box-shadow: 0 1px 3px rgba(0,0,0,.12); min-height: 60vh; line-height: 1.7; overflow-x: auto; }
  .paper h1 { font-size: 22px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .paper h2 { font-size: 18px; margin-top: 28px; } .paper h3 { font-size: 16px; margin-top: 22px; } .paper h4, .paper h5, .paper h6 { font-size: 14px; }
  .paper table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
  .paper th, .paper td { border: 1px solid #9aa0a6; padding: 4px 6px; vertical-align: middle; word-break: keep-all; }
  .paper th { background: #f1f3f5; }
  .paper img { max-width: 100%; height: auto; display: block; margin: 8px auto; }
  .paper blockquote { margin: 10px 0; padding: 8px 12px; background: #f6f8fa; border-left: 4px solid var(--line); color: var(--muted); }
  .paper hr.page { border: 0; border-top: 2px dashed var(--line); margin: 40px -56px; position: relative; }
  .paper hr.page::after { content: '쪽 나눔'; position: absolute; right: 56px; top: -10px; font-size: 11px; color: var(--muted); background: #fff; padding: 0 6px; }
  mark.need { background: var(--need-bg); color: var(--need-ink); padding: 0 2px; border-radius: 3px; }
  mark.ext { background: var(--ext-bg); color: var(--ext-ink); padding: 0 2px; border-radius: 3px; }
  pre.md { white-space: pre-wrap; font-size: 12px; background: #f6f8fa; padding: 12px; border-radius: 6px; }
  pre.err { white-space: pre-wrap; color: var(--ext-ink); background: var(--ext-bg); padding: 12px; border-radius: 6px; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .paper { padding: 24px 16px; margin: 10px 0 30px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1 id="pname">입안서 미리보기</h1>
      <div class="sub" id="psum">불러오는 중…</div>
      <div class="progress"><i id="pbar" style="width:0"></i></div>
    </div>
    <ul class="list" id="list"></ul>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main>
    <div class="bar">
      <h2 id="ctitle">-</h2>
      <span class="meta" id="cmeta"></span>
      <span class="spacer"></span>
      <span class="live" id="live">연결 중</span>
      <button id="toggleMd" type="button">마크다운 보기</button>
    </div>
    <div class="note" id="cnote"></div>
    <div class="checks" id="checks"></div>
    <div class="paper" id="paper"></div>
  </main>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let state = null;
  let current = decodeURIComponent(location.hash.slice(1)) || null;
  let showMd = false;

  function setLive(cls, text) { const el = $('live'); el.className = `live ${cls}`; el.textContent = text; }

  async function loadState() {
    const r = await fetch('/api/state');
    state = await r.json();
    renderSide();
    // 조립 전(장 목록이 빈 상태)에는 주소의 장을 그대로 둔다
    if (state.chapters.length && (!current || !state.chapters.some((c) => c.id === current))) current = state.chapters[0].id;
    await loadPart();
    if (state.status === 'ready') setLive('ok', `갱신 ${new Date(state.builtAt).toLocaleTimeString()} · ${state.ms}ms`);
    if (state.status === 'error') setLive('err', '조립 오류');
  }

  function renderSide() {
    $('pname').textContent = state.project.name || '입안서 미리보기';
    const done = state.chapters.filter((c) => c.status === '완료').length;
    $('psum').textContent = `완료 ${done} / ${state.chapters.length} 장`;
    $('pbar').style.width = state.chapters.length ? `${(done / state.chapters.length) * 100}%` : '0';
    $('list').innerHTML = state.chapters.map((c) => `
      <li data-id="${esc(c.id)}" class="${c.id === current ? 'sel' : ''}">
        <span class="t">${esc(c.title)}</span><span class="badge b-${esc(c.status)}">${esc(c.status)}</span>
        <span class="todo">${esc(c.todo || '')}</span>
        <span class="flags">${c.built ? '' : '<span class="f-draft">재료 초안</span>'}${c.flags.작성필요 ? `<span class="f-need">작성 필요 ${c.flags.작성필요}</span>` : ''}${c.flags.외부자료 ? `<span class="f-ext">외부 자료 ${c.flags.외부자료}</span>` : ''}${c.error ? '<span class="f-ext">오류</span>' : ''}</span>
      </li>`).join('');
    $('list').querySelectorAll('li').forEach((li) => li.addEventListener('click', () => { current = li.dataset.id; location.hash = encodeURIComponent(current); renderSide(); loadPart(); }));
    const docs = state.docs.map((d) => `<li>${esc(d.role === 'design' ? '설계' : '현황')} · ${esc(d.docId)}${d.facilityId ? ` (${esc(d.facilityId)})` : ''} · ${d.pages ?? '?'}쪽${d.note ? `<br><small>${esc(d.note)}</small>` : ''}</li>`).join('');
    const parcels = state.parcels.map((p) => `<li>필지 · ${esc(p.docId)} · ${p.count}필지</li>`).join('');
    $('foot').innerHTML = `
      <div>${state.changed && state.changed.length ? `바뀐 파일: ${esc(state.changed.join(', '))}` : '파일을 고치면 자동으로 다시 조립합니다.'}</div>
      <details><summary>입력 자료 (${state.docs.length + state.parcels.length})</summary><ul>${docs}${parcels}</ul></details>
      <details><summary>경고 (${state.warnings.length})</summary><ul>${state.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></details>`;
  }

  async function loadPart() {
    if (state && state.status === 'error' && state.error) {
      $('ctitle').textContent = '조립 오류';
      $('paper').innerHTML = `<pre class="err">${esc(state.error)}</pre>`;
      return;
    }
    if (!current) { $('paper').innerHTML = '<p>장이 없습니다.</p>'; return; }
    const r = await fetch(`/api/part?id=${encodeURIComponent(current)}`);
    if (!r.ok) return;
    const part = await r.json();
    $('ctitle').textContent = part.title;
    $('cmeta').textContent = `${part.status}${part.built ? '' : ' · 재료 초안'} · 작성 필요 ${part.flags.작성필요} · 외부 자료 ${part.flags.외부자료}`;
    $('cnote').textContent = [part.todo && `할 일: ${part.todo}`, part.note && `메모: ${part.note}`].filter(Boolean).join('  ·  ');
    $('checks').innerHTML = part.notes && part.notes.length ? `<b>확인할 것</b><ul>${part.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : '';
    const y = document.querySelector('main').scrollTop;
    $('paper').innerHTML = showMd ? `<pre class="md">${esc(part.markdown)}</pre>` : part.html + (part.error ? `<pre class="err">${esc(part.error)}</pre>` : '');
    document.querySelector('main').scrollTop = y;
  }

  window.addEventListener('hashchange', () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (id && id !== current) { current = id; renderSide(); loadPart(); }
  });
  $('toggleMd').addEventListener('click', () => { showMd = !showMd; $('toggleMd').textContent = showMd ? '문서 보기' : '마크다운 보기'; loadPart(); });

  function connect() {
    const es = new EventSource('/api/events');
    let seen = -1;
    es.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.reloadPage) { location.reload(); return; }
      if (msg.status === 'loading') { setLive('busy', msg.progress || '조립 중'); return; }
      if (msg.version !== seen) { seen = msg.version; loadState(); }
    };
    es.onerror = () => { setLive('err', '서버 연결 끊김 — 다시 연결 중'); };
  }
  connect();
})();
</script>
</body>
</html>
